<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - Rekixo</title>
  <meta name="description" content="Thank you page for Rekixo project request submissions." />
  <meta name="theme-color" content="#07111f" />
  <link rel="icon" type="image/svg+xml" href="rekixo-favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://rekixo.com/thank-you.html" />
  <style>
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef7ff;
      background:
        radial-gradient(circle at 20% 16%, rgba(87,199,255,0.16), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(125,255,207,0.14), transparent 32%),
        linear-gradient(180deg, #050b13 0%, #07111f 100%);
      display: flex;
      flex-direction: column;
    }

    header {
      width: min(1080px, 100%);
      min-height: 54px;
      margin: 0 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: #eef7ff;
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 10px 24px rgba(87,199,255,0.18));
    }

    .talk-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #eef7ff;
      background: rgba(255,255,255,0.05);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    main {
      margin: auto;
    }

    .card {
      width: min(620px, 100%);
      padding: 34px;
      border: 1px solid rgba(155,230,255,0.22);
      border-radius: 18px;
      background: rgba(8,21,34,0.88);
      box-shadow: 0 22px 70px rgba(0,0,0,0.34);
      text-align: center;
    }

    .card > img {
      width: 60px;
      height: 60px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.12;
    }

    p {
      margin: 0 auto 22px;
      max-width: 480px;
      color: #a9bacb;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      padding: 0 18px;
      border-radius: 12px;
      color: #06101d;
      background: linear-gradient(135deg, #57c7ff, #82e4ff 62%, #7dffcf);
      font-weight: 800;
      text-decoration: none;
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      header { min-height: 52px; }
      .brand img { width: 34px; height: 34px; }
      .header-actions { gap: 8px; }
      .talk-link { height: 42px; min-width: 0; padding: 0 10px; font-size: 12px; }
      .card { padding: 26px 18px; }
    }
  </style>
  <link rel="stylesheet" href="logo-animation.css" />

  <style>
    header .brand img[src$="rekixo-logo-parts.svg"] {
      width: 132px !important;
      height: auto !important;
      max-width: 38vw;
      aspect-ratio: 1737 / 402;
    }
    main.card > img[src$="rekixo-logo-parts.svg"] {
      width: min(300px, 78vw) !important;
      height: auto !important;
    }
    @media (max-width: 560px) {
      body { padding: 12px 10px; }
      header {
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }
      .brand { flex: 1 1 auto; overflow: hidden; }
      .brand-name { display: none; }
      header .brand img[src$="rekixo-logo-parts.svg"] {
        width: 118px !important;
        max-width: 34vw;
      }
      .header-actions {
        flex: 0 1 auto;
        gap: 6px;
        min-width: 0;
      }
      .talk-link {
        height: 38px;
        padding: 0 8px;
        font-size: 11px;
      }
    }
  </style>
  <link rel="me" href="https://www.linkedin.com/in/rekixo">
</head>
<body>
  <header>
    <a class="brand" href="index.html" aria-label="Rekixo home">
      <img src="rekixo-logo-parts.svg" alt="Rekixo logo" />
      <span class="brand-name">Rekixo</span>
    </a>
    <div class="header-actions">
      <a class="talk-link" href="referral.html">Get a new domain</a>
      <a class="talk-link" href="contact.html">Let’s Talk</a>
    </div>
  </header>
  <main class="card">
    <img src="rekixo-logo-parts.svg" alt="Rekixo logo" />
    <h1>Request received.</h1>
    <p>Thank you. Rekixo has received your software request and will reply after reviewing the details.</p>
    <a href="index.html">Back to Home</a>
  </main>
</body>
</html>
