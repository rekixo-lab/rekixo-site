name: REKIXO Cloudflare native checks
on:
  pull_request:
  push:
    branches: [main, cloudflare-native-fullstack-20261026]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static link, API and payment-security tests
        run: npm run validate
      - name: Validate D1 migrations against SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          for file in sorted(Path("migrations").glob("*.sql")):
              db.executescript(file.read_text())
          names = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"contacts", "payment_orders", "payment_events", "payment_refunds", "api_rate_limits"}
          assert expected <= names, (expected - names)
          assert "email_claimed_at" in {r[1] for r in db.execute("PRAGMA table_info(contacts)")}
          assert {"project_description", "request_admin_mobile"} <= {r[1] for r in db.execute("PRAGMA table_info(payment_orders)")}
          print("D1 migration tables and email recovery column verified")
          PY
  smoke-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke-test the live production website and API without payment
        run: npm run smoke:production
  verify-live-contact-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[verify-lead]')
    needs: [validate, smoke-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm one labeled synthetic non-paid enquiry can persist in D1
        run: node scripts/verify-production-contact-once.mjs
