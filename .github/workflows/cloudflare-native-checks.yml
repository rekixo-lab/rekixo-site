name: REKIXO Cloudflare native checks
on:
  pull_request:
  push:
    branches: [main, cloudflare-native-fullstack-20261026]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static link, API and payment-security tests
        run: npm run validate
