name: REKIXO Cloudflare native checks
on:
  pull_request:
  push:
    branches: [main, cloudflare-native-fullstack-20261026]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static link, API and payment-security tests
        run: npm run validate
      - name: Validate D1 migrations against SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          for file in sorted(Path("migrations").glob("*.sql")):
              db.executescript(file.read_text())
          names = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"contacts", "payment_orders", "payment_events", "payment_refunds", "api_rate_limits"}
          assert expected <= names, (expected - names)
          assert "email_claimed_at" in {r[1] for r in db.execute("PRAGMA table_info(contacts)")}
          print("D1 migration tables and email recovery column verified")
          PY
