name: Apply latest archive snapshot
on:
  push:
    branches:
      - sync/archive-20260923-rekixo-site
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/archive-20260923-rekixo-site
          fetch-depth: 0
      - name: Replace repository with canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical-snapshot
          tar -xzf .sync/snapshot.tar.gz -C /tmp/canonical-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch .
          cp -a /tmp/canonical-snapshot/. .
          rm -rf .sync
          rm -f .github/workflows/__chatgpt_apply_latest_archive.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot already matches repository."
            exit 0
          fi
          git commit -m "Sync latest canonical project snapshot"
          git push origin HEAD:sync/archive-20260923-rekixo-site
